name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Runs on pull requests from forks, so it must never need secrets. Anything
# that publishes or touches AWS belongs in release.yml, which only runs on tags.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      # The codebase still carries lint infos and warnings, so only analyzer
      # errors fail the build. Drop the flags once those are cleaned up.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

  # Builds the Windows app on every PR, so a change that breaks the Windows
  # build is caught before it reaches a release.
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

