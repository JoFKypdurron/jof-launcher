name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Runs on pull requests from forks, so it must never need secrets. Anything
# that publishes or touches AWS belongs in release.yml, which only runs on tags.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      # The codebase still carries lint infos and warnings, so only analyzer
      # errors fail the build. Drop the flags once those are cleaned up.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

  # Release builds of every shipped platform, on PRs only. Each merge to main
  # is tagged and released straight away, so a broken platform build must fail
  # here: in release.yml it would leave a tag behind with no release. Pushes to
  # main skip these, because release.yml builds the same commit right after.
  linux:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Get Flutter dependencies
        run: flutter pub get

      # Tests already run on Linux in the test job.
      - name: Build Linux release
        run: flutter build linux --release

  macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build macOS release
        run: flutter build macos --release

  windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release
